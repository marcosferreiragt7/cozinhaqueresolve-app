name: Prints do app para a pagina de vendas
on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Produto (ex.: pao)"
        required: true
        default: "pao"
permissions:
  contents: write
jobs:
  prints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: PRODUTO=${{ github.event.inputs.produto }} node tools/prints.js
      - name: Commit
        run: |
          git config user.name "prints[bot]"
          git config user.email "prints@users.noreply.github.com"
          git add -A '*/img/tela-*.jpg'
          git diff --cached --quiet || (git commit -m "Prints do app: ${{ github.event.inputs.produto }}" && git pull --rebase -q && git push)
