<style>
@font-face{font-family:Bebas;src:url(fonts/bebas.woff2) format("woff2");font-display:swap}
:root{
  --bg:#FBF5EA; --surface:#FFFFFF; --surface2:#F3EBDC; --ink:#1B231C; --muted:#66705F; --line:#E7DDCB;
  --green:#1D5A2C; --green-ink:#FFFFFF; --lime:#C8F53C; --lime-ink:#10170F; --orange:#E5642A;
  --shadow:0 10px 30px rgba(60,45,20,.10);
  --display:Bebas,Impact,"Arial Narrow",sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E120F; --surface:#171D18; --surface2:#1F2720; --ink:#EEF2EA; --muted:#A3AE9F; --line:#2A332B;
  --green:#2E7A3C; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E120F; --surface:#171D18; --surface2:#1F2720; --ink:#EEF2EA; --muted:#A3AE9F; --line:#2A332B; --green:#2E7A3C; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body)}
body{min-height:100dvh;padding-bottom:calc(84px + var(--safe-b))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.4px;line-height:.95;margin:0}

/* topo */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:var(--safe-t)}
.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.top .wrap > b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.igbtn{flex:0 0 auto;height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap}
.top small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top img{width:42px;height:42px}
.top b{font:400 23px/1 var(--display);letter-spacing:.3px}
.top small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.top .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px}

/* hero */
.hero{margin:6px 0 18px;border-radius:24px;overflow:hidden;position:relative;background:var(--green);color:#fff;min-height:210px;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,12,0) 20%,rgba(11,15,12,.85))}
.hero div{position:relative;z-index:1;padding:20px}
.hero h1{font-size:44px}
.hero h1 span{background:var(--lime);color:var(--lime-ink);padding:0 8px;border-radius:6px}
.hero p{margin:8px 0 0;font-size:15px;opacity:.92}

/* abas */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:5px;border-radius:16px;margin-bottom:16px}
.seg button{border:0;background:transparent;padding:12px 8px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* cards de receita */
.list{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-decoration:none}
.tile{flex:0 0 72px;height:72px;border-radius:14px;display:grid;place-items:center;font-size:36px}
.card h3{font-size:24px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.free{background:var(--lime);color:var(--lime-ink)}
.card .go{margin-left:auto;color:var(--muted);font-size:22px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h2{font-size:30px}
.sec span{color:var(--muted);font-size:14px}

/* vitrine */
.vit{background:var(--surface);border:2px solid var(--lime);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.vit .img{position:relative;height:170px;background:#0B0F0C}
.vit .img img{width:100%;height:100%;object-fit:cover;opacity:.85}
.ceia-vit .tag{background:var(--gold)!important;color:#2a1a05!important}
.vit .tag{position:absolute;top:12px;left:12px;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:12px;letter-spacing:.08em;padding:6px 10px;border-radius:999px}
.vit .in{padding:16px}
.vit h3{font-size:30px}
.vit p{margin:4px 0 12px;color:var(--muted)}
.vit ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.vit li{padding-left:26px;position:relative}
.vit li:before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:900}
.locks{display:grid;gap:6px;margin:0 0 16px}
.lock{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:16px;background:var(--green);color:#fff;font-weight:800;font-size:17px;text-decoration:none}
.cta.lime{background:var(--lime);color:var(--lime-ink)}
.price{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.price{gap:12px}.price b{font:400 34px/1 var(--display);color:var(--green);white-space:nowrap;flex:none}
.price small{color:var(--muted);font-size:13px}

/* receita */
.rhero{border-radius:24px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;position:relative;overflow:hidden;margin:6px 0 16px}
.rhero .big{position:absolute;right:-10px;top:-14px;font-size:150px;opacity:.95;transform:rotate(8deg)}
.rhero .free{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;padding:5px 10px;border-radius:999px;margin-bottom:10px}
.rhero h1{font-size:42px;max-width:80%}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.facts b{display:block;font:400 22px/1 var(--display)}
.facts small{color:var(--muted);font-size:12px}
.intro{margin:0 0 6px}
.actions{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.box h2{font-size:28px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.box h2 button{font:700 13px var(--body);letter-spacing:0;border:0;background:var(--surface2);border-radius:999px;padding:7px 12px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{appearance:none;flex:0 0 24px;height:24px;border-radius:8px;border:2px solid var(--line);margin:0;display:grid;place-items:center;background:var(--surface)}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked:after{content:"✓";color:#fff;font-weight:900;font-size:15px}
.chk input:checked + span{text-decoration:line-through;color:var(--muted)}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--lime);color:var(--lime-ink);font:400 22px/36px var(--display);text-align:center}
.step.done .n{background:var(--green);color:#fff}
.step.done p{color:var(--muted)}
.step p{margin:4px 0 0}
.tbtn{margin-top:8px;border:0;background:var(--surface2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.tip{background:color-mix(in srgb,var(--lime) 28%,var(--surface));border-color:transparent}
.tip p{margin:0}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
.jar{display:grid;gap:4px;margin-top:4px}
.jar div{border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;color:#10170F}

/* lista / vazio */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty div{font-size:46px}

/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:40;background:#0B0F0C;color:#fff;border-radius:18px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(92vw,420px)}
.timer.show{display:flex}
.timer b{font:400 34px/1 var(--display);color:var(--lime);min-width:84px}
.timer span{flex:1;font-size:13px;opacity:.85;line-height:1.3}
.timer button{border:0;border-radius:10px;padding:8px 10px;background:#232a24;color:#fff;font-weight:700}
.timer.end{background:var(--orange)}
.timer.end b{color:#fff}

/* banner instalar */
.install{display:none;gap:10px 12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--green);border-radius:16px;padding:12px 14px;margin:6px 0 14px}
.install.show{display:flex}
.install div{flex:1 1 180px;font-size:14px;line-height:1.35}
.install b{display:block;font-size:15px}
.install button{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;font-size:14px}
.install{position:relative;padding-right:34px}
.install .x{position:absolute;top:4px;right:4px;background:transparent;color:var(--muted);padding:6px 8px;font-size:16px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:68px}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;font-weight:700;color:var(--muted)}
nav a i{font-style:normal;font-size:22px;line-height:1;filter:grayscale(1);opacity:.7}
nav a[aria-current="page"]{color:var(--ink)}
nav a[aria-current="page"] i{filter:none;opacity:1}
.toast{position:fixed;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:30px 0 10px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .in{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + var(--safe-b))}
.sheet h3{font-size:30px;margin-bottom:10px}
.sheet ol{padding-left:20px;margin:0 0 16px;display:grid;gap:8px}
/* ===== v2 ===== */
.hello{margin:8px 0 12px}
.hello h1{font-size:40px}
.hello p{margin:2px 0 0;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:14px}
.search input{flex:1;border:0;background:transparent;font:500 16px var(--body);color:var(--ink);padding:14px 0;outline:none;min-width:0}
.search:focus-within{border-color:var(--green)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.feat{flex:0 0 78%;max-width:320px;scroll-snap-align:start;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:4/5;text-decoration:none;color:#fff;box-shadow:var(--shadow);background:#222}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.82))}
.feat > div{position:absolute;left:16px;right:16px;bottom:16px;z-index:1}
.feat h3{font-size:34px}
.feat .pill{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(6px)}
.feat .free{background:var(--lime);color:var(--lime-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.thumb{flex:0 0 76px;height:76px;border-radius:14px;overflow:hidden;position:relative;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ok{position:absolute;right:4px;bottom:4px;background:var(--green);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 6px}
.prog{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0 4px}
.prog .bar{flex:1;height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--green));border-radius:999px}
.prog b{font:400 24px/1 var(--display)}
.prog small{color:var(--muted);font-size:13px;display:block}
.menu{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border-radius:22px;padding:18px;text-decoration:none;box-shadow:var(--shadow);position:relative;overflow:hidden}
.menu h3{font-size:30px}
.menu p{margin:4px 0 0;opacity:.9;font-size:14px}
.menu .em{font-size:46px}
.menu .go{margin-left:auto;font-size:26px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.cat{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1/1;background:#111;color:#fff}
.cat img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05)}
.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.8))}
.cat div{position:absolute;left:10px;right:10px;bottom:10px;z-index:1}
.cat b{display:block;font:400 34px/1 var(--display);color:var(--lime)}
.cat span{font-weight:700;font-size:13px;line-height:1.2;display:block}
.cat .lk{position:absolute;top:8px;right:8px;z-index:1;background:rgba(0,0,0,.55);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}
.bonus{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.bonus::-webkit-scrollbar{display:none}
.bon{flex:0 0 132px;background:var(--surface2);border-radius:14px;overflow:hidden}
.bon img{width:100%;height:96px;object-fit:cover;display:block}
.bon div{padding:8px 10px}
.bon small{color:var(--orange);font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.bon b{display:block;font-size:13px;line-height:1.25}
.trust{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:10px}
.vit h4{font:800 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.rhero.ph{background:#111;min-height:340px}
.rhero.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rhero.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.85))}
.rhero.ph > *{position:relative;z-index:1}
.rhero .cred{position:absolute;top:12px;right:12px;z-index:1;font-size:11px;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:999px;opacity:.9}
.done-btn{margin-top:14px}
.done-btn.on{background:var(--surface2);color:var(--green)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.day h3{font-size:26px;margin:2px 4px 8px}
.meal{display:flex;gap:12px;align-items:center;text-decoration:none;padding:6px 4px}
.meal img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.meal small{display:block;color:var(--orange);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.meal b{font-weight:700;font-size:15px}
.result-empty{color:var(--muted);padding:12px 4px}
.mine{padding:14px}
.mineh{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.mineh img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.mineh small{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--green)}
.mineh h2{font-size:24px!important;display:block!important}
.openrow{display:grid;gap:8px}
.howto{margin:0 0 12px;padding-left:20px;display:grid;gap:6px;font-size:14px}
.fld{display:block;margin-top:10px}
.fld span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fld input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:500 15px var(--body)}
.fld.file input{padding:10px;font-size:14px}
.edit{margin-top:12px}
.edit summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
.already{display:block;text-align:center;margin-top:10px;font-weight:700;font-size:14px;color:var(--green)}
nav a{font-size:12px}
.btn.help{width:100%;justify-content:center;padding:16px;font-size:16px;margin-top:14px}
.sheet .in{max-height:90dvh;overflow:auto}
.cta.big{padding:18px;font-size:18px;margin-top:10px}

const idb={db:null,open(){return this.db||(this.db=new Promise((ok,er)=>{try{const r=indexedDB.open("cqr",1);r.onupgradeneeded=()=>r.result.createObjectStore("arquivos");r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}catch(e){er(e)}}))},
  async put(k,v){const d=await this.open();return new Promise((ok,er)=>{const t=d.transaction("arquivos","readwrite");t.objectStore("arquivos").put(v,k);t.oncomplete=ok;t.onerror=()=>er(t.error)})},
  async get(k){const d=await this.open();return new Promise((ok,er)=>{const q=d.transaction("arquivos").objectStore("arquivos").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>er(q.error)})},
  async del(k){const d=await this.open();return new Promise(ok=>{const t=d.transaction("arquivos","readwrite");t.objectStore("arquivos").delete(k);t.oncomplete=ok;t.onerror=ok})}};

async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function liberar(codigo){
  codigo=(codigo||"").trim();const m=codigo.match(/(?:liberar\/)?([a-z]{4,10}-[A-Za-z0-9]{6,})/);if(!m)return null;
  try{const p=window.CEIA.codigos[await sha(m[1])];if(!p)return null;const a=acessos();p.split("+").forEach(x=>a[x]=true);store.set("acessos",a);track("Liberou",{produto:p},true);return p.split("+")[0]}catch(e){return null}
}

function contaPreco(o){
  const un=Math.max(1,num(o.un)), base=num(o.ing)+num(o.outros)+num(o.horas)*num(o.valorHora);
  const fornada=base*(1+num(o.perdas)/100)+num(o.emb)*un;
  const cu=fornada/un, t=num(o.taxa)/100, m=num(o.margem)/100;
  const preco=(1-t-m)>0.05?cu/(1-t-m):0;
  return {fornada,cu,preco,lucro:preco*(1-t)-cu};
}
const precoCampos=[["ing","Ingredientes da fornada (R$)"],["un","Unidades na fornada"],["emb","Embalagem por unidade (R$)"],["outros","Energia, gás e outros da fornada (R$)"],["horas","Horas de trabalho na fornada"],["valorHora","Quanto vale sua hora (R$)"],["perdas","Reserva de perdas (%)"],["taxa","Taxas sobre a venda (%)"],["margem","Margem desejada (%)"]];

      <label><span>Resultado</span><select id="ltRes"><option>Bom</option><option>Ajustar</option><option>Descartado</option></select></label><label><span>Observações</span><input id="ltObs" placeholder="tempo de forno, temperatura da cozinha..."></label></div>
      <button class="cta" id="ltAdd" style="margin-top:12px">+ Registrar lote</button></div>
    ${Lt.length?Lt.map((x,i)=>({x,i})).reverse().map(({x,i})=>{const perda=num(x.cru)?((num(x.cru)-num(x.ass))/num(x.cru)*100):0;
      return `<div class="box ped"><div><b>${esc(x.cod)} · ${esc(x.nome)}</b><small>${esc(fdata(x.data))} · ${esc(x.q||"?")} un. · cru ${esc(x.cru||"?")} g → assado ${esc(x.ass||"?")} g${perda?` · perda ${perda.toFixed(1).replace(".",",")}%`:""} · ${esc(x.res)}${x.obs?" · "+esc(x.obs):""}</small></div><button class="linkbtn" data-ltdel="${i}">Apagar</button></div>`}).join(""):`<p class="simple">Nenhum lote registrado ainda.</p>`}`}
  return back+`<div class="sec"><h2>${T[1]} ${T[2]}</h2></div>`+body+`<p class="foot">Os dados da Central PRO ficam salvos só neste celular.</p>`;
}

    $("#ajQ").oninput=go;go()}

    view.querySelectorAll("[data-st]").forEach(s=>s.onchange=()=>{const L=A();L[+s.dataset.st].st=s.value;store.set("pro:agenda",L)});
    view.querySelectorAll("[data-agdel]").forEach(b=>b.onclick=()=>{const L=A();L.splice(+b.dataset.agdel,1);store.set("pro:agenda",L);route(true)})}
  if(t==="lotes"){const Lt=()=>store.get("pro:lotes",[]);
    $("#ltAdd").onclick=()=>{const r=rec($("#ltRec").value),d=$("#ltD").value||hoje(),L=Lt();store.set("pro:ltSel",r.id);
      const n=L.filter(x=>x.data===d).length+1,cod="L-"+d.slice(8,10)+d.slice(5,7)+"-"+n;
      L.push({cod,data:d,rid:r.id,nome:r.nome,q:$("#ltQ").value,cru:$("#ltCru").value,ass:$("#ltAss").value,res:$("#ltRes").value,obs:$("#ltObs").value.trim()});store.set("pro:lotes",L);toast("Lote "+cod+" registrado");route(true)};

/* ---------- roteador ---------- */
const view=$("#view");
function route(keep){
  keep=keep===true;
  const y=window.scrollY;
  const h=location.hash.replace(/^#/,"")||"/";
  let html,nav="inicio";
  if(h.startsWith("/liberar/")){liberar(decodeURIComponent(h.slice(9))).then(p=>{if(p){toast("Liberado! 🎉");location.replace(p==="*"?"#/completo":p==="pro"?"#/pro":"#/c/"+(p==="presentes5"?"presentes":p))}else{toast("Link de acesso inválido");location.replace("#/minhas")}});html=`<div class="empty"><div>🎄</div><p>Liberando seu acesso…</p></div>`}
  else if(h.startsWith("/c/")){html=colecao(decodeURIComponent(h.slice(3)));nav="completo"}
  else if(h.startsWith("/g/")){html=guia(decodeURIComponent(h.slice(3)));nav="completo"}
  else if(h.startsWith("/r/")){html=recipe(decodeURIComponent(h.slice(3)));nav="inicio"}
  else if(h==="/favoritos"){html=favoritos();nav="favoritos"}
  else if(h==="/lista"){html=lista();nav="lista"}
  else if(h==="/cardapio"){html=cardapio();nav="cardapio"}
  else if(h==="/minhas"){html=colecoesPage();nav="completo"}
  else if(h==="/pro"||h.startsWith("/pro/")){html=pro(h.slice(5));nav="completo"}
  else if(h==="/completo"){html=colecoesPage();nav="completo"}
  else if(h==="/vitrine"){html=vitrinePage();nav="vitrine"}
  else if(h==="/hoje"){const rd=receitaDoDia();track("AbriuReceitaDoDia",{via:origem},true);location.replace(rd?"#/r/"+rd.id:"#/");return}
  else if(h==="/suporte"){html=suportePage();nav="completo"}
  else html=home();
  view.innerHTML=html;
  document.querySelectorAll("nav a").forEach(a=>{if(a.dataset.nav===nav)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,keep?y:0);
  bind(h);
}

/* ---------- timer ---------- */
const T={el:$("#timer"),end:0,left:0,run:false,iv:null};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTimer(min,label){T.left=min*60;T.end=Date.now()+T.left*1000;T.run=true;$("#tLabel").textContent=label;$("#tPause").textContent="Pausar";T.el.classList.remove("end");T.el.classList.add("show");tick();clearInterval(T.iv);T.iv=setInterval(tick,500)}
function tick(){if(!T.run)return;const s=(T.end-Date.now())/1000;$("#tLeft").textContent=fmt(s);if(s<=0){T.run=false;clearInterval(T.iv);T.el.classList.add("end");$("#tLeft").textContent="PRONTO";$("#tPause").textContent="Ok";beep();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}}
$("#tPause").onclick=()=>{if(T.el.classList.contains("end")){T.el.classList.remove("show");return}if(T.run){T.left=(T.end-Date.now())/1000;T.run=false;$("#tPause").textContent="Continuar"}else{T.end=Date.now()+T.left*1000;T.run=true;$("#tPause").textContent="Pausar";clearInterval(T.iv);T.iv=setInterval(tick,500)}};
$("#tStop").onclick=()=>{T.run=false;clearInterval(T.iv);T.el.classList.remove("show")};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.4,.8].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.3);o.start(a.currentTime+d);o.stop(a.currentTime+d+.3)})}catch(e){}}

/* ---------- instalação ---------- */
let deferred=null;
const ua=navigator.userAgent||"";
const inApp=/Instagram|FBAN|FBAV|FB_IAB/i.test(ua);
const ios=/iPhone|iPad|iPod/i.test(ua);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;setupInstall()});
window.addEventListener("appinstalled",()=>{track("AppInstalado",{},true);store.set("instalado",true);setupInstall()});
function setupInstall(){
  const box=$("#install");if(!box)return;
  if(standalone||store.get("instalado",false)||store.get("fechouInstall",0)>Date.now()){box.classList.remove("show");return}
  box.innerHTML=`<span style="font-size:28px">📲</span><div><b>Deixe o app no seu celular</b>Abre com um toque, mesmo sem internet.</div><button id="inst">Instalar</button><button class="x" id="instX" aria-label="Agora não">✕</button>`;
  box.classList.add("show");
  $("#instX").onclick=()=>{store.set("fechouInstall",Date.now()+3*864e5);box.classList.remove("show")};
  $("#inst").onclick=async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;return}
    let b;
    if(inApp)b=`<p>Você abriu pelo Instagram. Para instalar, abra no navegador do celular:</p><ol><li>Toque nos <b>três pontinhos ⋯</b> no canto da tela</li><li>Escolha <b>${ios?"Abrir no navegador externo":"Abrir no Chrome"}</b></li><li>Lá, toque em <b>Instalar</b> de novo</li></ol>`;
    else if(ios)b=`<ol><li>Toque no botão <b>Compartilhar</b> (quadrado com seta ↑) no Safari</li><li>Role e toque em <b>Adicionar à Tela de Início</b></li><li>Toque em <b>Adicionar</b></li></ol>`;
    else b=`<ol><li>Toque nos <b>três pontinhos ⋮</b> do navegador</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b></li></ol>`;
    $("#sheetT").textContent="Instale o app";$("#sheetOk").textContent="Entendi";$("#sheetB").innerHTML=b;$("#sheet").classList.add("show");
  };
}
$("#sheetOk").onclick=()=>$("#sheet").classList.remove("show");
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.remove("show")};

if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
route();
})();
